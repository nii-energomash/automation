# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish Docker Image with Tag (release on Tag trigger)
description: >
  Сборка и публикация docker образа с указанием версии
  (при добавлении git-тега в master-ветку)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  docker:
    uses: nii-energomash/automation/.github/workflows/npm-docker-publish.yml@v1
    with:
      mode: release
      registry: ghcr.io
      image-name: ${{ github.repository }}
      node-version: '20'
      npm-scopes-with-registers: |
        @${{ vars.NPM_SCOPE }}:registry=${{ vars.NPM_REGISTRY_URL }}
        @${{ vars.NPM_ORG_SCOPE }}:registry=${{ vars.NPM_REGISTRY_URL }}
    secrets:
      node-auth-token: ${{ secrets.GH_PACKAGES_TOKEN }}
      docker-auth-token: ${{ secrets.GITHUB_TOKEN }}

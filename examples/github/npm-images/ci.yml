# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Continuous Integration
description: >
  Workflow для push в feature-ветки (быстрый CI).
  Проверяем код, собираем build (не docker образ), но не сохраняем его.
  Ветка master (main) игнорируется

on:
  push:
    branches: ["**", "!master", "!main"]

jobs:
  ci:
    uses: nii-energomash/automation/.github/workflows/npm-ci.yml@master
    with:
      node-version: "20"
      npm-scopes-with-registers: |
        @andrey-aka-skif:registry=https://npm.pkg.github.com
        @nii-energomash:registry=https://npm.pkg.github.com
    secrets:
      node-auth-token: ${{ secrets.GITHUB_TOKEN }}

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish NPM Package with Tag (release on Tag trigger)
description: >
  Сборка и публикация NPM-пакета с указанием версии
  (при добавлении git-тега в master-ветку)

on:
  push:
    tags: ["v*.*.*"]

jobs:
  publish:
    uses: https://192.168.100.252:3000/usov-andrey/automation/.gitea/workflows/npm-package-publish.yml@v1
    with:
      mode: release
      node-version: "20"
      npm-scopes-with-registers: |
        @${{ vars.NPM_SCOPE }}:registry=${{ vars.NPM_REGISTRY_URL }}
    secrets:
      node-auth-token: ${{ secrets.GT_PACKAGES_TOKEN }}

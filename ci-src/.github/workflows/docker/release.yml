# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# источник: nii-energomash/automation/ci-src/.github/workflows/docker/release.yml
# место: .github/workflows/release.yml

# Публикация релизного образа в ghcr.io. Версия берётся из git-тега vX.Y.Z — в
# исходниках её нет. Единственный триггер — publish GitHub Release: тег снимает
# состояние, релиз объявляет его пригодным для передачи наружу, поэтому голый
# push тега НЕ публикует. Упавшее задание перезапускается кнопкой Re-run.
#
# Задание archive — упаковка выпуска для развёртывания без docker — здесь не
# приводится: его содержимое определяется языком и способом сборки проекта.
# Примеры для Python и .NET — в docs/docker.md.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Версия выводится один раз и раздаётся заданиям. Два независимых вывода из
  # одного тега — тот же класс расхождения, ради которого политика тегов вынесена
  # в отдельный экшен.
  version:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Шаг общий со второй площадкой, см. .ci/actions/version-from-tag.
      - name: Версия из тега
        id: version
        uses: ./.ci/actions/version-from-tag
        with:
          tag: ${{ github.ref_name }}

  image:
    needs: version

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Настройка buildx
        uses: docker/setup-buildx-action@v4

      # Встроенный токен вместо PAT: он не истекает, не требует ручного
      # обновления и ограничен этим репозиторием. Права даёт блок permissions.
      - name: Вход в реестр
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Экшен взят ради одного: имя репозитория может содержать заглавные буквы,
      # а имена образов бывают только в нижнем регистре — приводит он.
      # Метки его вывода не берутся, см. шаг сборки.
      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=latest

      # Версия уходит аргументом сборки и попадает в метаданные сборок. Ведущего
      # v здесь нет — это версия сервиса, а не имя тега.
      #
      # provenance: false — не украшательство, а условие работы автоочистки. По
      # умолчанию buildx прикладывает к образу манифест с происхождением сборки,
      # и в реестре к тегу добавляется вторая версия — без тегов. Отличить такую
      # от осиротевшей очистка не может, и удаление «мусора» разобрало бы живой
      # образ. Атрибуция сборки у нас и так есть — меткой
      # org.opencontainers.image.revision.
      #
      # Метки заданы списком, а не выводом metadata-action: тот собирает
      # их из карточки репозитория и его адреса, и содержимое образа начинает
      # зависеть от полей, которые правятся мимо репозитория.
      #
      # Токен доступа к внутреннему реестру зависимостей уходит в сборку
      # секретом BuildKit: ARG остался бы в docker history готового образа.
      # Проекту, чья сборка ничего оттуда не тянет, строка secrets не нужна.
      - name: Сборка и публикация
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          build-args: |
            API_VERSION=${{ needs.version.outputs.version }}
          secrets: |
            packages_token=${{ secrets.GH_PACKAGES_TOKEN }}

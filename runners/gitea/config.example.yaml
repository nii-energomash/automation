# источник: nii-energomash/automation/runners/gitea/config.example.yaml
# место: <runner-dir>/config.yaml

# Конфиг act_runner, снятый с живого раннера. Значения, привязанные к машине
# и к инстансу, заменены плейсхолдерами в угловых скобках; что чем заменять —
# в docs/gitea-runner.md.
#
# Секций, которых здесь нет, в живом конфиге тоже нет: act_runner берёт для
# них значения по умолчанию. Дописывать их сюда не из чего — бэкап отражает
# работающую настройку, а не полный перечень возможностей.

log:
  level: info

runner:
  # Сколько заданий раннер берёт одновременно.
  capacity: 2

  # Потолок на одно задание.
  timeout: 3h

  # Метка задания → образ, в котором оно поднимается. Метка одна: шаблоны
  # из ci-src/ объявляют только ubuntu-latest.
  labels:
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-latest"

container:
  network: bridge

  # При указании privileged: true контейнер задания получает root на хосте
  # (доступ к устройствам, может смонтировать диск хоста и писать куда угодно).
  # Значение privileged: false указано для однозначности.
  # Второй путь к тому же результату остаётся открытым и этим не
  # закрывается: /var/run/docker.sock в docker-compose.yaml раннера позволяет
  # попросить демон хоста создать другой, уже привилегированный контейнер.
  privileged: false

  # Инстанс Gitea живёт за собственным удостоверяющим центром, и в образе
  # задания его сертификата нет: без этих строк ложится уже checkout, а следом
  # всё, что ходит в инстанс по HTTPS. Путь до сертификата — путь на хосте:
  # контейнер задания создаёт демон хоста, и -v он читает своей стороной.
  options: "-v <runner-dir>/certs/gitea-ca.crt:/tmp/gitea-ca.crt:ro -e NODE_EXTRA_CA_CERTS=/tmp/gitea-ca.crt -e GIT_SSL_CAINFO=/tmp/gitea-ca.crt -e SSL_CERT_FILE=/tmp/gitea-ca.crt"

  # Белый список того, что заданию разрешено монтировать. Он же пропускает -v
  # из options выше: без записи здесь монтирование не состоится.
  valid_volumes:
    - "<runner-dir>/certs/gitea-ca.crt"

cache:
  enabled: true

  # Пусто — каталог по умолчанию внутри контейнера раннера
  # ($HOME/.cache/actcache). Наружу томом он не вынесен, поэтому кеш переживает
  # перезапуск контейнера, но не пересоздание.
  dir: ""

  # Адрес и порт, по которым в кеш-сервер раннера стучится контейнер задания.
  # Здесь это адрес машины в сети, а не имя сервиса: раннер, задания и инстанс
  # не собраны в одну изолированную сеть. Состояние вынужденное, продиктовано
  # текущей настройкой сервера, и образцом не является — при изолированной
  # сети адресация уходит на имена, а этот адрес наружу не выставляется.
  #
  # Порт задан явно: иначе он выбирается заново при каждом старте и его не
  # открыть на межсетевом экране.
  host: "<runner-host>"
  port: <cache-port>

# источник: nii-energomash/automation/deploy/docker/spa/nginx.conf
# место: docker/nginx.conf

# Конфигурация nginx для образа SPA — то, чем сервис настраивается при доставке
# образом. В репозитории проекта лежит рядом с Dockerfile и уезжает внутрь
# образа строкой
# COPY ./docker/nginx.conf /etc/nginx/conf.d/default.conf — то есть заменяет
# серверную секцию по умолчанию, а не весь nginx.conf. Директив уровня main,
# events и http здесь поэтому нет.
#
# Это конфигурация внутри образа. Хостовый nginx, который стоит перед
# контейнерами, сюда не относится — граница описана в docs/deploy.md.
#
# Тело секции перенесено как есть: обезличивать в нём нечего, наружу смотрит
# только порт 80 внутри контейнера.

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Обработка ошибок
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Оптимизация производительности
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: (reusable) Publish release NPM Package on Tag
description: >
  Переиспользуемый workflow, описывающий сборку и публикацию NPM-пакета с указанием версии
  (соответствует git-тегу вида 'v*.*.*', добавленному в master-ветку)

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        default: feature
        description: Режим публикации (release | rebuild)

      tag:
        required: false
        type: string
        default: ""
        description: Тег, указываемый при ручной пересборке

      npm-tag:
        required: false
        type: string
        default: replay
        description: Имя npm тега. Если не указать, то добавится тег :latest, что нежелательно при повторной публикации

      node-version:
        required: false
        type: string
        default: "20"
        description: Версия Node.js

      base-branch:
        required: false
        type: string
        default: master
        description: Ветка, в которой должен находиться тег

      lint-script:
        required: false
        type: string
        default: lint
        description: npm-скрипт проверки стиля. Пустое значение пропускает шаг

      test-script:
        required: false
        type: string
        default: test
        description: npm-скрипт тестов. Пустое значение пропускает шаг

      build-script:
        required: false
        type: string
        default: build
        description: npm-скрипт сборки. Пустое значение пропускает шаг

      npm-scopes-with-registers:
        type: string
        required: false
        default: ""
        description: >
          Массив строк, разделенный переносом строки, и содержащий scope и адрес регистра в формате
          @\<scope\>:registry=\<uri\>. Например: @username:registry=https://gitea.example/api/packages/username/npm/

    secrets:
      node-auth-token:
        required: false
        description: Токен для приватных NPM регистров

jobs:
  ci-and-publish:
    runs-on: ubuntu-latest
    container:
      image: node:20-bullseye

    steps:
      - name: 🧠 Resolve build context
        uses: https://192.168.100.252:3000/usov-andrey/automation/.github/actions/resolve-context@v1
        id: ctx
        with:
          mode: ${{ inputs.mode }}
          tag: ${{ inputs.tag }}

      - name: 🛒 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.ctx.outputs.ref }}
          persist-credentials: true

      - name: 🔍 Validate tag format
        if: inputs.mode == 'rebuild'
        uses: https://192.168.100.252:3000/usov-andrey/automation/.github/actions/validate-tag-format@v1
        with:
          tag: ${{ steps.ctx.outputs.tag }}

      - name: 🔍 Validate tag on base branch
        uses: https://192.168.100.252:3000/usov-andrey/automation/.github/actions/validate-ref-on-master@v1
        with:
          ref: ${{ steps.ctx.outputs.ref }}
          base-branch: ${{ inputs.base-branch }}

      - name: ✨ Setup Node.js (version ${{ inputs.node-version }})
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          # setup-node начиная с v5 сам включает кеш npm, если в package.json
          # есть поле packageManager. В публикации кеша не было — это лишняя
          # переменная в шаге, от которого зависит содержимое пакета.
          package-manager-cache: false

      - name: 📝 Configure NPM registries
        uses: https://192.168.100.252:3000/usov-andrey/automation/.gitea/actions/npm-registries-configure@v1
        with:
          npm-scopes-with-registers: ${{ inputs.npm-scopes-with-registers }}
          node-auth-token: ${{ secrets.node-auth-token }}
          strict-ssl: "false"

      - name: 📌 Set package version from tag
        uses: https://192.168.100.252:3000/usov-andrey/automation/.github/actions/npm-setup-package-version-from-tag@v1
        with:
          tag: ${{ steps.ctx.outputs.version }}

      - name: 📦 Install dependencies
        shell: bash
        run: npm ci --no-fund

      # Имя скрипта приходит переменной окружения, а не подстановкой в текст
      # команды: подставленное значение стало бы частью кода.
      - name: 📝 Lint
        if: ${{ inputs.lint-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🧪 Tests
        if: ${{ inputs.test-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.test-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🛠️ Build
        if: ${{ inputs.build-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$NPM_SCRIPT"

      - name: Publish to Github Registry with current Tag
        if: inputs.mode == 'release'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.node-auth-token }}

      - name: Publish to Github Registry with specified Tag
        if: inputs.mode == 'rebuild'
        run: npm publish --tag "${{ inputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.node-auth-token }}

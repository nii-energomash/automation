# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: NPM registries configure
description: >
  Настраивает регистры NPM для указанных scopes.
  Для работы получает массив строк, разделенный переносом строки,
  и содержащий scope и адрес регистра в формате @<scope>:registry=<uri>.
  Например: @username:registry=https://192.168.100.252:3000/api/packages/username/npm/

inputs:
  npm-scopes-with-registers:
    type: string
    required: false
    default: ""
    description: >
      Массив строк, разделенный переносом строки, и содержащий scope и адрес регистра в формате
      @<scope>:registry=<uri>. Например: @username:registry=https://192.168.100.252:3000/api/packages/username/npm/

  node-auth-token:
    type: string
    required: false
    description: |
      Токен для аутентификации в NPM регистрах. По умолчанию используется github.token.
      Для использования PAT передайте: secrets.YOUR_TOKEN

runs:
  using: composite
  steps:
    - shell: bash
      if: ${{ inputs.npm-scopes-with-registers != '' }}
      run: |
        chmod +x "${{ github.action_path }}/registries-configure.sh"
        "${{ github.action_path }}/registries-configure.sh"
      env:
        SCOPES_WITH_REGISTERS: ${{ inputs.npm-scopes-with-registers }}
        NODE_AUTH_TOKEN: ${{ inputs.node-auth-token }}

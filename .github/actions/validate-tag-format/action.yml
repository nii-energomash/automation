# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Validate tag format
description: Валидация git-тега в формате v*.*.*

inputs:
  tag:
    required: true
    description: Git-тег

runs:
  using: composite
  steps:
    - name: 🔍 Validate git-tag
      shell: bash
      # Значение приходит переменной окружения, а не подстановкой в текст
      # скрипта: подставленное значение стало бы частью кода.
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        TAG="$INPUT_TAG"

        echo "🔎 Input tag: $TAG"

        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid tag format: $TAG"
          echo "Expected: vMAJOR.MINOR.PATCH (e.g. v1.2.3)"
          exit 1
        fi

        echo "✅ Формат тега OK: $TAG"

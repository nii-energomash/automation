# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Resolve context
description: Определить контекст вызова workflow

inputs:
  mode:
    required: true
    type: string
    default: feature
    description: Режим (release | feature | rebuild)

  tag:
    required: false
    type: string
    default: ""
    description: Тег, указываемый при ручной пересборке

  registry:
    required: false
    type: string
    default: ghcr.io
    description: Регистр образов

  image-name:
    required: false
    type: string
    default: ${{ github.repository }}
    description: Имя образа

  technical-tag-prefix:
    required: false
    type: string
    default: sha-
    description: Префикс технического тега, добавляемого в режиме feature

outputs:
  ref:
    value: ${{ steps.resolve.outputs.ref }}
    description: Git-ref

  version:
    value: ${{ steps.resolve.outputs.version }}
    description: Версия на основе git-тега

  tag:
    value: ${{ steps.resolve.outputs.tag }}
    description: Версия на основе git-тега (например, v1.2.3)

  image-references:
    value: ${{ steps.resolve.outputs.image-references }}
    description: >
      Список имен образов в формате
      <registry>/\<image-name\>:\<version\>

runs:
  using: composite
  steps:
    - name: 🔍 Resolve context
      id: resolve
      shell: bash
      # Значения приходят переменными окружения, а не подстановкой в текст
      # скрипта: подставленное значение стало бы частью кода.
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        INPUT_TECHNICAL_TAG_PREFIX: ${{ inputs.technical-tag-prefix }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # Перенос строки в значении добавил бы в $GITHUB_OUTPUT лишнюю
        # строку 'имя=значение', то есть подменил бы произвольный выход шага.
        set_output() {
          if [[ "$2" == *$'\n'* ]]; then
            echo "❌ Значение '$1' содержит перенос строки"
            exit 1
          fi
          printf '%s=%s\n' "$1" "$2" >>"$GITHUB_OUTPUT"
        }

        REPO="${INPUT_REGISTRY}/${INPUT_IMAGE_NAME}"

        if [[ "$INPUT_MODE" == "feature" ]]; then
          REF="${GITHUB_REF}"
          TAG="${INPUT_TECHNICAL_TAG_PREFIX}${COMMIT_SHA}"
          VERSION=""
          IMAGE_REFERENCES="$REPO:$TAG"

        elif [[ "$INPUT_MODE" == "release" ]]; then
          REF="${GITHUB_REF}"
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${GITHUB_REF#refs/tags/v}"
          IMAGE_REFERENCES="$REPO:$TAG,$REPO:latest"

        elif [[ "$INPUT_MODE" == "rebuild" ]]; then
          REF="refs/tags/${INPUT_TAG}"
          TAG="${INPUT_TAG}"
          VERSION="${TAG#v}"
          IMAGE_REFERENCES="$REPO:$TAG"

        else
          echo "❌ Неизвестный режим mode: $INPUT_MODE"
          exit 1
        fi

        echo "✅ Context resolved:"
        echo "  ref: $REF"
        echo "  version: $VERSION"
        echo "  tag: $TAG"
        echo "  image-references:"
        echo "$IMAGE_REFERENCES" | tr ',' '\n' | sed 's/^/    - /'

        set_output ref "$REF"
        set_output version "$VERSION"
        set_output tag "$TAG"
        set_output image-references "$IMAGE_REFERENCES"

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Setup NPM package version
description: Установка версии npm-пакета на основе git-тега

inputs:
  tag:
    required: false
    type: string
    description: >
      Git-тег в формате 'v*.*.*'.
      Если не указан, используется значение из github.ref.

outputs:
  tag:
    value: ${{ steps.version-final.outputs.package-version }}
    description: Resolved git-tag

runs:
  using: composite
  steps:
    - name: Set package version from tag
      id: version-tag
      shell: bash
      if: inputs.tag != ''
      # Значение приходит переменной окружения, а не подстановкой в текст
      # скрипта: подставленное значение стало бы частью кода.
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        VERSION="$INPUT_TAG"
        VERSION="${VERSION#v}"

        npm version "$VERSION" \
          --no-git-tag-version \
          --allow-same-version

        echo "📌 Установлена версия npm пакета из git-тега: ${VERSION}"
        printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"

    - name: Set package version from commit hash
      id: version-hash
      shell: bash
      if: inputs.tag == ''
      run: |
        set -euo pipefail

        EMPTY_VERSION="0.0.0"
        HASH=$(git rev-parse --short HEAD)

        VERSION="${EMPTY_VERSION}-${HASH}"

        npm version "$VERSION" \
          --no-git-tag-version \
          --allow-same-version

        echo "📌 Установлена версия npm пакета из hash коммита: ${VERSION}"
        printf 'version=%s\n' "$VERSION" >>"$GITHUB_OUTPUT"

    - name: Output final version
      id: version-final
      shell: bash
      # Значения приходят переменными окружения, а не подстановкой в текст
      # скрипта: подставленное значение стало бы частью кода.
      env:
        VERSION_FROM_TAG: ${{ steps.version-tag.outputs.version }}
        VERSION_FROM_HASH: ${{ steps.version-hash.outputs.version }}
      run: |
        set -euo pipefail

        FINAL_VERSION="${VERSION_FROM_TAG:-$VERSION_FROM_HASH}"
        echo "✅ Final package version: ${FINAL_VERSION}"
        printf 'package-version=%s\n' "$FINAL_VERSION" >>"$GITHUB_OUTPUT"

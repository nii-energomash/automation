# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Docker cleanup
description: >
  Удаление docker-образов.
  Будут удалены образы, теги которых начинаются с 'sha-', и которые старше указанного возраста.
  Требуется permissions.packages.write и permissions.contents.read.
  Путь до пакета выбирается по типу владельца репозитория: у организации это
  /orgs/{org}/packages/..., у пользователя — /users/{username}/packages/...
  github.token удаляет версии только у пакета, привязанного к репозиторию;
  для пакета без такой привязки нужен PAT с правом delete:packages

inputs:
  days-old:
    required: false
    type: string
    default: "1"
    description: "Удалить образы старше чем D дней"
  hours-old:
    required: false
    type: string
    default: "0"
    description: "Удалить образы старше чем D дней и H часов (0–23)"
  show-only:
    required: false
    default: false
    type: boolean
    description: "Только показать список (не удалять)"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        chmod +x "${{ github.action_path }}/cleanup.sh"
        "${{ github.action_path }}/cleanup.sh"
      env:
        DAYS_OLD: ${{ inputs.days-old }}
        HOURS_OLD: ${{ inputs.hours-old }}
        SHOW_ONLY: ${{ inputs.show-only }}
        GH_TOKEN: ${{ github.token }}

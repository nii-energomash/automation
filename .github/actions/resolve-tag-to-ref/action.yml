# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Resolve tag to ref (НЕ НУЖЕН?)
description: Получение git-ref по переданному git-тегу (используется при ручной публикации по тегу)

inputs:
  tag:
    required: true
    description: Тег в фомате v*.*.*

outputs:
  ref:
    value: ${{ steps.resolve.outputs.ref }}
    description: Resolved git-ref (refs/tags/...)

runs:
  using: composite
  steps:
    - name: 🔍 Validate tag format
      uses: ./.github/actions/validate-tag-format
      with:
        tag: ${{ inputs.tag }}

    - name: ➡️ Resolve tag to ref
      id: resolve
      shell: bash
      # Значение приходит переменной окружения, а не подстановкой в текст
      # скрипта: подставленное значение стало бы частью кода.
      env:
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail

        TAG="$INPUT_TAG"
        echo "🔎 Input tag: $TAG"

        REF="refs/tags/$TAG"

        echo "🔍 Проверка существования тега '$TAG'..."
        if ! git show-ref --verify "$REF" >/dev/null 2>&1; then
          echo "❌ Ошибка: тег '$TAG' не найден в репозитории"
          echo ""
          echo "Доступные теги:"
          git tag -l --sort=-version:refname "v*" | head -10
          echo ""
          exit 1
        fi

        # Перенос строки в значении добавил бы в $GITHUB_OUTPUT лишнюю
        # строку 'имя=значение', то есть подменил бы произвольный выход шага.
        if [[ "$REF" == *$'\n'* ]]; then
          echo "❌ Значение ref содержит перенос строки"
          exit 1
        fi

        printf 'ref=%s\n' "$REF" >>"$GITHUB_OUTPUT"
        echo "📌 Full ref: $REF"

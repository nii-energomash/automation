# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Resolve tag from ref
description: Извлечение git-тега из переданного git-ref (используется при публикации по тегу)

inputs:
  ref:
    required: false
    description: Git-ref (если не передан, используется github.ref)

outputs:
  tag:
    value: ${{ steps.resolve.outputs.tag }}
    description: Resolved git-tag

runs:
  using: composite
  steps:
    - name: 🏷️ Resolve tag from ref
      id: resolve
      shell: bash
      # Значения приходят переменными окружения, а не подстановкой в текст
      # скрипта: подставленное значение стало бы частью кода.
      env:
        INPUT_REF: ${{ inputs.ref }}
        DEFAULT_REF: ${{ github.ref }}
      run: |
        set -euo pipefail

        REF="${INPUT_REF:-$DEFAULT_REF}"

        if [ -z "${REF}" ]; then
          echo "❌ Ошибка: ref не определён"
          exit 1
        fi

        TAG="${REF#refs/tags/}"

        if [ "${TAG}" = "${REF}" ]; then
          echo "❌ Ошибка: переданный ref '${REF}' не указывает на git-тег"
          exit 1
        fi

        # Перенос строки в значении добавил бы в $GITHUB_OUTPUT лишнюю
        # строку 'имя=значение', то есть подменил бы произвольный выход шага.
        if [[ "$TAG" == *$'\n'* ]]; then
          echo "❌ Значение тега содержит перенос строки"
          exit 1
        fi

        printf 'tag=%s\n' "$TAG" >>"$GITHUB_OUTPUT"
        echo "📌 Тег из ref: ${TAG}"

# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: (reusable) NPM CI
description: >
  Переиспользуемый workflow, описывающий Continuous Integration для NPM-проектов

on:
  workflow_call:
    inputs:
      publish-artifact:
        required: false
        type: boolean
        default: false
        description: Сохранять результат сборки как артефакт

      artifact-name:
        required: false
        type: string
        default: build
        description: Имя артефакта

      artifact-path:
        required: false
        type: string
        default: dist/
        description: Что сохранять в артефакт

      artifact-retention-days:
        required: false
        type: string
        default: "1"
        description: Сколько дней хранить артефакт

      lint-script:
        required: false
        type: string
        default: lint
        description: npm-скрипт проверки стиля. Пустое значение пропускает шаг

      test-script:
        required: false
        type: string
        default: test
        description: npm-скрипт тестов. Пустое значение пропускает шаг

      build-script:
        required: false
        type: string
        default: build
        description: npm-скрипт сборки. Пустое значение пропускает шаг

      ref:
        required: false
        type: string
        default: ""
        description: Указатель на коммит (используется при сборке по тегу)

      node-version:
        required: false
        type: string
        default: "20"
        description: Версия Node.js

      npm-scopes-with-registers:
        type: string
        required: false
        default: ""
        description: >
          Массив строк, разделенный переносом строки, и содержащий scope и адрес регистра в формате
          @\<scope\>:registry=\<uri\>. Например: @username:registry=https://npm.pkg.github.com

          Обратить внимание:

          Если в зависимостях присутствует пакет, расположенный в приватном регистре,
          то для такого приватного регистра требуется передать NPM токен.
          Однако, если пакет публичный, это может привести к ошибке 403 Forbidden

    secrets:
      node-auth-token:
        required: false
        description: Токен для приватных NPM регистров

jobs:
  reusable-ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: ✨ Setup Node.js (version ${{ inputs.node-version }})
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: 📝 Configure npm registries
        uses: nii-energomash/automation/.github/actions/npm-registries-configure@master
        with:
          npm-scopes-with-registers: ${{ inputs.npm-scopes-with-registers }}
          node-auth-token: ${{ secrets.node-auth-token }}

      - name: 📦 Install dependencies
        shell: bash
        run: npm ci --no-fund

      # Имя скрипта приходит переменной окружения, а не подстановкой в текст
      # команды: подставленное значение стало бы частью кода.
      - name: 📝 Lint
        if: ${{ inputs.lint-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🧪 Tests
        if: ${{ inputs.test-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.test-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🛠️ Build
        if: ${{ inputs.build-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 📦 Upload artifact
        if: ${{ inputs.publish-artifact }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: ${{ inputs.artifact-retention-days }}

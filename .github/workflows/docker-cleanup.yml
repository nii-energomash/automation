# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: (reusable) Docker cleanup images with technical tags
description: >
  Переиспользуемый workflow, описывающий удаление docker-образов.
  Будут удалены образы, теги которых начинаются с заданного префикса (по умолчанию 'sha-'),
  и которые старше указанного возраста

on:
  workflow_call:
    inputs:
      days-old:
        required: false
        type: string
        default: "0"
        description: Удалить образы старше чем D дней

      hours-old:
        required: false
        type: string
        default: "1"
        description: Удалить образы старше чем D дней и H часов (0–23)

      # Строка, а не boolean: вызывающий workflow пробрасывает сюда
      # ${{ inputs.show-only }}, а при триггере schedule контекст inputs пуст
      # и выражение даёт ''. В boolean-вход пустая строка не приводится —
      # workflow не стартует вовсе.
      show-only:
        required: false
        type: string
        default: "false"
        description: Только показать список (не удалять)

      technical-tag-prefix:
        required: false
        type: string
        default: sha-
        description: Префикс технических тегов, по которому отбираются образы

      image-name:
        required: false
        type: string
        default: ""
        description: >
          Имя образа — то же, под которым образ публикуется.
          По умолчанию имя репозитория

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: 🧹 Cleanup Docker images
        uses: nii-energomash/automation/.github/actions/docker-cleanup@v1
        with:
          # Умолчания входов тут не спасают: вызывающий workflow передаёт
          # значение явно, и пустая строка со schedule перекрывает default.
          days-old: ${{ inputs.days-old || '0' }}
          hours-old: ${{ inputs.hours-old || '1' }}
          show-only: ${{ inputs.show-only || 'false' }}
          technical-tag-prefix: ${{ inputs.technical-tag-prefix || 'sha-' }}
          image-name: ${{ inputs.image-name || github.repository }}

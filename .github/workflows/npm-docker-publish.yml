# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: (reusable) Publish release Docker Image on Tag
description: >
  Переиспользуемый workflow, описывающий сборку и публикацию docker образа с указанием версии
  (соответствует git-тегу, добавленному в master-ветку)

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        default: feature
        description: Режим сборки (release | feature | rebuild)

      tag:
        required: false
        type: string
        default: ""
        description: Тег, указываемый при ручной пересборке

      registry:
        required: false
        type: string
        default: ghcr.io
        description: Регистр образов

      image-name:
        required: false
        type: string
        default: ${{ github.repository }}
        description: Имя образа

      node-version:
        required: false
        type: string
        default: "20"
        description: Версия Node.js

      base-branch:
        required: false
        type: string
        default: master
        description: Ветка, в которой должен находиться тег

      technical-tag-prefix:
        required: false
        type: string
        default: sha-
        description: Префикс технического тега, добавляемого в режиме feature

      lint-script:
        required: false
        type: string
        default: lint
        description: npm-скрипт проверки стиля. Пустое значение пропускает шаг

      test-script:
        required: false
        type: string
        default: test
        description: npm-скрипт тестов. Пустое значение пропускает шаг

      build-script:
        required: false
        type: string
        default: build
        description: npm-скрипт сборки. Пустое значение пропускает шаг

      npm-scopes-with-registers:
        type: string
        required: false
        default: ""
        description: >
          Массив строк, разделенный переносом строки,
          и содержащий scope и адрес регистра в формате
          @\<scope\>:registry=\<uri\>.
          Например: @username:registry=https://npm.pkg.github.com

    secrets:
      docker-auth-token:
        required: true
        description: Токен для публикации Docker-образа

      node-auth-token:
        required: false
        description: Токен для приватных NPM регистров

permissions:
  contents: read
  packages: write

jobs:
  ci-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 🧠 Resolve build context
        uses: nii-energomash/automation/.github/actions/resolve-context@master
        id: ctx
        with:
          mode: ${{ inputs.mode }}
          tag: ${{ inputs.tag }}
          registry: ${{ inputs.registry }}
          image-name: ${{ inputs.image-name }}
          technical-tag-prefix: ${{ inputs.technical-tag-prefix }}

      - name: 🛒 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.ctx.outputs.ref }}
          persist-credentials: true

      - name: 🔍 Validate tag format
        if: inputs.mode != 'feature'
        uses: nii-energomash/automation/.github/actions/validate-tag-format@master
        with:
          tag: ${{ steps.ctx.outputs.tag }}

      - name: 🔍 Validate tag on base branch
        if: inputs.mode != 'feature'
        uses: nii-energomash/automation/.github/actions/validate-ref-on-master@master
        with:
          ref: ${{ steps.ctx.outputs.ref }}
          base-branch: ${{ inputs.base-branch }}

      - name: ✨ Setup Node.js (version ${{ inputs.node-version }})
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          # setup-node начиная с v5 сам включает кеш npm, если в package.json
          # есть поле packageManager. В публикации кеша не было — это лишняя
          # переменная в шаге, от которого зависит содержимое образа.
          package-manager-cache: false

      - name: 📝 Configure NPM registries
        uses: nii-energomash/automation/.github/actions/npm-registries-configure@master
        with:
          npm-scopes-with-registers: ${{ inputs.npm-scopes-with-registers }}
          node-auth-token: ${{ secrets.node-auth-token }}

      - name: 📌 Set package version from tag
        uses: nii-energomash/automation/.github/actions/npm-setup-package-version-from-tag@master
        with:
          tag: ${{ steps.ctx.outputs.version }}

      - name: 📦 Install dependencies
        shell: bash
        run: npm ci --no-fund

      # Имя скрипта приходит переменной окружения, а не подстановкой в текст
      # команды: подставленное значение стало бы частью кода.
      - name: 📝 Lint
        if: ${{ inputs.lint-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.lint-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🧪 Tests
        if: ${{ inputs.test-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.test-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🛠️ Build
        if: ${{ inputs.build-script != '' }}
        shell: bash
        env:
          NPM_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$NPM_SCRIPT"

      - name: 🔐 Log in to container registry (${{ inputs.registry }})
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.docker-auth-token }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ctx.outputs.image-references }}
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.node-auth-token }}
